<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet — Perfil da Instituição</title>
    <link rel="stylesheet" href="static/ong-portal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-paw paw-logo"></i>
                <span>Adota<strong>Pet</strong> <span class="badge-ong">Painel da ONG</span></span>
            </a>
            <div class="user-menu">
                <span class="user-name" id="ongNavName">Instituição</span>
                <a href="login.html" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-title">Navegação</div>
            <a href="dashboard-instituicao.html" class="sidebar-nav-item"><i class="fa-solid fa-chart-pie"></i> Visão Geral</a>
            <a href="gestao-pets.html" class="sidebar-nav-item"><i class="fa-solid fa-paw"></i> Gerenciar Pets</a>
            <a href="acompanhamento-adocoes.html" class="sidebar-nav-item"><i class="fa-solid fa-clipboard-check"></i> Processos de Adoção</a>
            <a href="gestao-apadrinhamentos.html" class="sidebar-nav-item"><i class="fa-solid fa-hand-holding-dollar"></i> Apadrinhamentos</a>
            <div class="admin-sidebar-title" style="margin-top: 16px;">Configurações</div>
            <a href="perfil-instituicao.html" class="sidebar-nav-item active"><i class="fa-solid fa-building-ngo"></i> Dados da Instituição</a>
        </aside>

        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1>Dados Cadastrais da Instituição</h1>
                    <p style="color: var(--text-muted);">Mantenha as informações da sua ONG atualizadas no catálogo público.</p>
                </div>
            </div>

            <div class="card" style="max-width: 800px;">
                <form id="perfilOngForm" onsubmit="salvarPerfilInstituicao(event)">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label>Razão Social / Nome Fantasia *</label>
                            <input type="text" id="razao_social" required>
                        </div>

                        <div class="form-group">
                            <label>CNPJ *</label>
                            <input type="text" id="cnpj" required>
                        </div>

                        <div class="form-group">
                            <label>E-mail de Contato *</label>
                            <input type="email" id="email" required>
                        </div>

                        <div class="form-group">
                            <label>CEP</label>
                            <input type="text" id="cep">
                        </div>

                        <div class="form-group">
                            <label>Rua / Logradouro</label>
                            <input type="text" id="rua">
                        </div>

                        <div class="form-group">
                            <label>Número</label>
                            <input type="text" id="numero">
                        </div>

                        <div class="form-group">
                            <label>Bairro</label>
                            <input type="text" id="bairro">
                        </div>

                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" id="cidade">
                        </div>

                        <div class="form-group">
                            <label>Estado (UF)</label>
                            <input type="text" id="estado" maxlength="2" style="text-transform: uppercase;">
                        </div>

                        <div class="form-group full">
                            <label>Complemento</label>
                            <input type="text" id="complemento">
                        </div>

                        <div class="form-group full">
                            <label>Telefone Principal</label>
                            <input type="text" id="telefone">
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px;">
                        <button type="button" class="btn btn-danger" onclick="apagarContaOng()"><i class="fa-solid fa-trash"></i> Apagar Conta da Instituição</button>
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Salvar Dados</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api';
        let session = null;

        document.addEventListener('DOMContentLoaded', () => {
            session = JSON.parse(localStorage.getItem('adotapet_session'));
            if (!session || !session.id_usuario) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('ongNavName').textContent = session.nome || 'Instituição';
            carregarPerfil();
        });

        async function carregarPerfil() {
            try {
                const res = await fetch(`${API_URL}/instituicao/${session.id_usuario}/perfil`);
                if (!res.ok) throw new Error('Erro ao carregar perfil');
                const data = await res.json();

                document.getElementById('razao_social').value = data.razao_social || '';
                document.getElementById('cnpj').value = data.cnpj || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('cep').value = data.cep || '';
                document.getElementById('rua').value = data.rua || '';
                document.getElementById('numero').value = data.numero || '';
                document.getElementById('bairro').value = data.bairro || '';
                document.getElementById('cidade').value = data.cidade || '';
                document.getElementById('estado').value = data.estado || '';
                document.getElementById('complemento').value = data.complemento || '';
                document.getElementById('telefone').value = data.telefones[0] || '';
            } catch (err) {
                console.error(err);
            }
        }

        async function salvarPerfilInstituicao(e) {
            e.preventDefault();
            const tel = document.getElementById('telefone').value.trim();
            const payload = {
                razao_social: document.getElementById('razao_social').value.trim(),
                cnpj: document.getElementById('cnpj').value.trim(),
                email: document.getElementById('email').value.trim(),
                cep: document.getElementById('cep').value.trim(),
                rua: document.getElementById('rua').value.trim(),
                numero: document.getElementById('numero').value.trim(),
                bairro: document.getElementById('bairro').value.trim(),
                cidade: document.getElementById('cidade').value.trim(),
                estado: document.getElementById('estado').value.trim(),
                complemento: document.getElementById('complemento').value.trim(),
                telefones: tel ? [tel] : []
            };

            try {
                const res = await fetch(`${API_URL}/instituicao/${session.id_usuario}/perfil`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error('Erro ao salvar');
                alert('🎉 Dados da instituição atualizados com sucesso!');

                session.nome = payload.razao_social;
                session.email = payload.email;
                localStorage.setItem('adotapet_session', JSON.stringify(session));
                document.getElementById('ongNavName').textContent = payload.razao_social;

            } catch (err) {
                alert('Erro ao atualizar dados cadastrais.');
            }
        }

        async function apagarContaOng() {
            const confirmacao = confirm('⚠️ ATENÇÃO: Deseja realmente excluir a conta da sua instituição?\n\nEsta ação apagará permanentemente todos os seus pets, históricos de prontuários, adoções e apadrinhamentos vinculados.');
            if (!confirmacao) return;

            try {
                const res = await fetch(`${API_URL}/instituicao/${session.id_usuario}`, {
                    method: 'DELETE'
                });

                if (!res.ok) throw new Error('Erro ao deletar conta');
                alert('Conta excluída com sucesso.');
                localStorage.removeItem('adotapet_session');
                window.location.href = 'home.html';
            } catch (err) {
                alert('Erro ao excluir conta.');
            }
        }
    </script>
</body>
</html>
